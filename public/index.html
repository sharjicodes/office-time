<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#f7fafc" />
    <meta name="description" content="Milo · Your Office Companion" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Milo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/milo-192.png" />
    <title>Milo · Your Office Companion</title>
    <script>
      // The website root opens the Milo guide first. App launches, invitation
      // links, and auth callbacks continue into the app directly.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var appParams = ['milo', 'call', 'match', 'ludo', 'code', 'error', 'error_description', 'token_hash', 'type'];
        var isAppLink = appParams.some(function (key) { return params.has(key); }) || window.location.hash.indexOf('access_token=') >= 0;
        if (window.location.pathname === '/' && !isAppLink) window.location.replace('/landing.html');
      })();
    </script>
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; font-family: var(--milo-font-family, system-ui, sans-serif); }
      body.milo-large-text #root { zoom: 1.12; }
      body.milo-high-contrast #root { filter: contrast(1.18); }
      body.milo-reduced-motion *, body.milo-reduced-motion *::before, body.milo-reduced-motion *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      @media (prefers-reduced-motion: reduce) {
        html:not(.milo-motion-enabled) *, html:not(.milo-motion-enabled) *::before, html:not(.milo-motion-enabled) *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {}));
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Milo.</noscript>
    <div id="root"></div>
  </body>
</html>
